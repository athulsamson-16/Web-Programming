<center>
<h2><u><font color ="red">STRING METHOD</u></h2>
</center>
<center>
<p><b>java script string method</b></p>
<script> var name="i am athul p";
document.write(name);
document.write("<br/>");
document.write("length of string is:");
document.write(name.length);
document.write("<br/>");
document.write("index of first occurance of a in string is:");
document.write(name.indexOf("a"));
document.write("<br/>");
document.write("index of Last occurance of a in string is:");
document.write(name.lastindexOf("a"));
document.write("<br/>");
document.write("index of am in string is:");
document.write(name.search("am"));
document.write("<br/>");
document.write("index 0 to 3 print using slice:");
document.write(name.slice(0,4));
document.write("<br/>");
document.write("to get substring o fstring using substring:");
document.write(name.substring(0,8));
document.write("<br/>");
document.write("to get substring o fstring using substr:");
document.write(name.substr(0,3));
document.write("<br/>");
document.write("string to upper case:");
document.write(name.toUpperCase());
document.write("<br/>");
document.write("replaMATHce athul p to parambil string:");
document.write(name.replace("athul p","parambil"));
document.write("<br/>");
document.write("use trim:");
document.write(name.trim());
document.write("<br/>");
document.write("new string that have charecter 5 on string:");
document.write(name.charAt(5));
document.write("<br/>");
document.write("print numeric ASSI value of charecter 5 on string:");
document.write(name.charCodeAt(5));
document.write("<br/>");
</script>
